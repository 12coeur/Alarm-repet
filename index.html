<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=5.0, user-scalable=yes">
    <title>Alarme Répétitive | Chrono / Compteur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="Images/logo.png" type="image/png">
</head>

<body class="mode-chrono">

    <div class="container">

        <header class="compact-header">
            <div class="header-top">
                <button id="burger-btn" class="burger-btn" aria-label="Menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="controls-compact header-controls">
                    <div class="main-controls">
                        <button id="startStopBtn" class="btn start-btn main-control-row">
                            <i class="fas fa-play"></i> Start
                        </button>
                        <div class="cycle-display main-control-row" id="cycleDisplay">
                            <div class="cycle-number-center" id="cycleCountCenter">0</div>
                        </div>
                        <button id="resetBtn" class="btn reset-btn main-control-row" disabled>
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                </div>
                <a href="https://www.youtube.com/@jlhumez/playlists" target="_blank" rel="noopener" class="logo-container">
                    <img src="Images/logo.png" alt="Logo JL Humez" class="logo">
                </a>
            </div>
        </header>

        <main>
            <div class="timer-section">
                <div class="sector-with-background">
                    <div id="series-image-behind" class="series-image-reduced"></div>
                    <div id="circular-timer" class="circular-timer-sector"></div>
                    <div class="time-display-overlay" id="timeDisplay" style="display: none;">00:12</div>
                    <div class="activity-title-overlay" id="activityTitle" style="display: none;">Allongements</div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

            </div>
        </main>

        <footer class="compact-footer">
            <p>Alarme Répétitive © 11 2026 - Asde Coeur.</p>
        </footer>
    </div>

    <!-- MENU HAMBURGER -->
    <nav id="burger-menu" aria-hidden="true">
        <section class="menu-section">
            <div class="mode-toggle-group">
                <button id="modeChronoBtn" class="mode-btn active">⏱️ Chrono</button>
                <button id="modeCompteurBtn" class="mode-btn">🔁 Compteur</button>
            </div>
        </section>

        <section class="menu-section" id="modeInfoSection">
            <h3 id="modeInfoTitle">Chrono</h3>
            <p id="modeInfoText">
                5 activités proposées, mais vous pouvez faire votre propre mix.<br>
                Le temps de préparation ; c’est aussi pour faire des pauses !
            </p>
        </section>

        <section class="menu-section" id="prepSliderSection">
            <label class="time-label prepa-label" for="secondes_prepa">Temps de préparation / récupération (sec)</label>
            <input type="range" id="secondes_prepa" min="0" max="30" value="12" step="1" class="slider prepa-slider">
            <span class="value-display prepa-value" id="secondesPrepaValue">12</span>
        </section>

        <section class="menu-section" id="workSliderContainer">
            <div id="chronoWorkDiv" class="work-slider-container">
                <label class="time-label cycle-title" for="seconds">Durée exercice (secondes)</label>
                <input type="range" id="seconds" min="0" max="300" value="22" step="1" class="slider cycle-slider">
                <span class="value-display cycle-value" id="secondsValue">22</span>
            </div>

            <div id="counterWorkDiv" class="work-slider-container" style="display:none;">
                <label class="time-label decompte-label" for="repsTarget">Décompte (répétitions)</label>
                <input type="range" id="repsTarget" min="0" max="60" value="10" step="1" class="slider decompte-slider">
                <span class="value-display decompte-value" id="repsValue">10</span>
            </div>
        </section>

        <section class="menu-section" id="activitySection">
            <h3>Activité</h3>
            <select id="activity-select" class="activity-select">
                <option value="allonge">Allongement</option>
                <option value="gainage">Gainage</option>
                <option value="ballon">Ballon</option>
                <option value="abdo">Abdo</option>
                <option value="chaise">Chaise</option>
                <option value="decompte">Décompte</option>
            </select>
        </section>

        <section class="menu-section">
            <h3>Réglages</h3>
            <div class="settings-compact">
                <div class="setting-item"><label><input type="checkbox" id="wakeLock" checked> <span class="setting-text">Empêcher mise en veille</span></label></div>
                <div class="setting-item"><label><input type="checkbox" id="vibrate" checked> <span class="setting-text">Vibrations</span></label></div>
                <div class="setting-item"><label><input type="checkbox" id="screenLock" checked> <span class="setting-text">Verrouillage écran (9:16)</span></label></div>
            </div>
            <div class="sensitivity-item" id="sensitivityItem">
                <label>Sensibilité compteur <span id="sensitivityValue">2.0</span></label>
                <!-- Échelle 0 à 5 -->
                <input type="range" id="sensitivitySlider" min="0" max="5" step="0.1" value="2.0">
            </div>
        </section>

        <section class="menu-section">
            <h3 style="color:#81C784">🔔 Sonnerie Pause, préparation (verte)</h3>
            <div class="ringtones-grid" id="prepaRingtonesContainer"></div>
        </section>

        <section class="menu-section" id="exerciseRingtonesSection">
            <h3 style="color:#F44336">🔔 Exercices, décompte (rouge)</h3>
            <div class="ringtones-grid" id="ringtonesContainer"></div>
        </section>

    </nav>

    <audio id="alarmSound" preload="auto"><source src="Sonneries/sonnerie1.wav" type="audio/wav"></audio>

    <script src="script.js"></script>
</body>
</html>
